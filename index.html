<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HITH-CAC Directory</title>
<!-- v11 - config-driven categories, tiered search -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HITH-CAC">
<meta name="theme-color" content="#F2F4F3">
<style>
:root{
  --bg:#F2F4F3;--surface:#FFFFFF;--ink:#111614;--ink2:rgba(17,22,20,.58);--ink3:rgba(17,22,20,.34);
  --hair:rgba(17,22,20,.10);--teal:#0E5E52;--r:14px;
  --sys:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sys);font-size:16px;line-height:1.42;
  min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
button{font-family:inherit;font-size:inherit;background:none;border:none;color:inherit;cursor:pointer;text-align:left}
a{text-decoration:none;color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.topbar{position:sticky;top:0;z-index:30;background:rgba(242,244,243,.82);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 8px}
.topbar.scrolled{border-bottom-color:var(--hair)}
.tb-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:32px}
.tb-title{font-size:17px;font-weight:600;letter-spacing:-.2px;opacity:0;transition:opacity .18s;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.scrolled .tb-title{opacity:1}
.tb-btn{font-size:16px;color:var(--teal);font-weight:500;padding:4px 2px;white-space:nowrap;cursor:pointer}
.seg{display:flex;background:rgba(17,22,20,.06);border-radius:9px;padding:2px}
.seg span{font-size:13px;font-weight:600;padding:5px 14px;border-radius:7px;color:var(--ink2);
  transition:background .15s,color .15s,box-shadow .15s;cursor:pointer}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.page{max-width:760px;margin:0 auto;padding:6px 20px 0}
.large{font-size:33px;font-weight:800;letter-spacing:-.7px;padding:6px 0 2px}
.subline{font-size:14px;color:var(--ink2);padding-bottom:14px}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.group-h{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;
  padding:0 20px 7px 4px;margin-top:2px}
.row{display:flex;align-items:center;gap:13px;padding:12px 16px;width:100%;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;left:45px;right:0;top:0;height:.5px;background:var(--hair)}
.row:active{background:rgba(17,22,20,.04)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .lbl{flex:1;font-size:16px;font-weight:450;letter-spacing:-.1px}
.row .cnt{font-size:15px;color:var(--ink3);font-variant-numeric:tabular-nums}
.chev{color:var(--ink3);font-size:14px;font-weight:600}
.srow{padding:13px 16px;position:relative}
.srow+.srow::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--hair)}
.srow .line1{display:flex;align-items:center;gap:8px}
.srow .nm{font-size:16px;font-weight:590;letter-spacing:-.2px;flex:1;line-height:1.3}
.vd{width:6px;height:6px;border-radius:50%;background:#2FA060;flex:none}
.srow .ds{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.srow .meta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.srow .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.call{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;
  padding:7px 14px;border-radius:999px;cursor:pointer}
.call:active{filter:brightness(.9)}
.web2{display:inline-flex;align-items:center;font-size:14px;font-weight:500;color:var(--ink2);
  background:rgba(17,22,20,.055);padding:7px 14px;border-radius:999px}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:0 2px 12px;font-size:13px;color:var(--ink3)}
.crumbs span[data-action]{font-weight:600;color:var(--teal);cursor:pointer}
.crumbs .sep{opacity:.5}
.crumbs .cur{font-weight:600;color:var(--ink)}
.qtitle{font-size:24px;font-weight:750;letter-spacing:-.5px;padding:2px 2px 4px;line-height:1.2}
.qsub{font-size:14px;color:var(--ink2);padding:0 2px 14px;max-width:56ch}
.opt-row{display:flex;align-items:center;gap:13px;padding:14px 16px;width:100%;position:relative;cursor:pointer}
.opt-row+.opt-row::before{content:"";position:absolute;left:45px;right:0;top:0;height:.5px;background:var(--hair)}
.opt-row:active{background:rgba(17,22,20,.04)}
.oc{width:10px;height:10px;border-radius:50%;flex:none}
.ot{flex:1}
.ot .t1{font-size:16px;font-weight:560;letter-spacing:-.15px}
.ot .t2{font-size:13px;color:var(--ink2);margin-top:1px}
.note2{font-size:13.5px;color:var(--ink2);background:var(--surface);border-radius:var(--r);padding:12px 16px;
  margin-bottom:14px;border-left:3px solid var(--teal)}
.pill-link{display:inline-block;font-size:14px;font-weight:600;color:var(--teal);padding:12px 4px;cursor:pointer}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(to top, var(--bg) 55%, rgba(242,244,243,0));pointer-events:none}
.dock-in{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:999px;padding:6px 8px 6px 18px;
  box-shadow:0 2px 6px rgba(17,22,20,.08),0 12px 32px rgba(17,22,20,.14)}
.dock-in .ic{color:var(--ink3);font-size:15px;flex:none}
.dock input{flex:1;border:none;font-size:16px;font-family:var(--sys);background:none;color:var(--ink);padding:8px 0;min-width:0}
.dock input::placeholder{color:var(--ink3)}
.hb{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:18px;flex:none;font-weight:700;cursor:pointer}
.reslabel2{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:0 4px 6px}
.empty{color:var(--ink3);text-align:center;padding:36px 20px;font-size:15px}
.foot{text-align:center;font-size:12px;color:var(--ink3);padding:8px 20px 4px;line-height:1.7}
.foot b{color:var(--teal);font-weight:600}
.fade{animation:fa .2s ease}
@keyframes fa{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.datarow{display:flex;align-items:center;gap:13px;padding:12px 16px;position:relative;cursor:pointer}
.datarow+.datarow::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--hair)}
.datarow:active{background:rgba(17,22,20,.04)}
.datarow .lbl{flex:1;font-size:15px;font-weight:500}
.datarow .sub{font-size:12.5px;color:var(--ink3)}
.datarow.danger .lbl{color:#B3372B}
#fileinput{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  background:#111614;color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;z-index:50;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.law{font-size:12px;color:var(--ink3);margin-top:5px}
.law b{font-weight:600;color:var(--ink2)}
.acard{background:var(--surface);border-radius:var(--r);padding:15px 16px 14px;margin-bottom:12px}
.acard .ah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.acard .at{font-size:17px;font-weight:650;letter-spacing:-.2px}
.fpill{font-size:11.5px;font-weight:650;padding:2.5px 9px;border-radius:999px;letter-spacing:.02em}
.acard .ab{font-size:14px;color:var(--ink2);line-height:1.5}
.acard .ab p{margin-top:6px}
.acard .prac{font-size:13px;margin-top:9px;padding:9px 12px;border-radius:10px;line-height:1.45}
.draft{display:inline-block;font-size:11.5px;font-weight:650;color:#96731F;background:rgba(150,115,31,.12);padding:3px 10px;border-radius:999px;margin-bottom:10px}
.qlist{background:var(--surface);border-radius:var(--r);padding:6px 16px;margin-bottom:14px}
.qlist .qi{padding:10px 0;position:relative;font-size:15px;line-height:1.45}
.qlist .qi+.qi{border-top:.5px solid var(--hair)}
.qlist .qi .qn{font-weight:650;color:var(--teal);margin-right:6px}
.frow{display:flex;gap:10px;padding:9px 0;position:relative;font-size:14px;line-height:1.4}
.frow+.frow{border-top:.5px solid var(--hair)}
.frow .fno{flex:none;width:78px;font-weight:650;font-size:12.5px}
.frow .fd{flex:1;color:var(--ink2)}
.frow .fd b{color:var(--ink)}
.fopen{display:inline-block;font-size:12px;font-weight:650;padding:3px 11px;border-radius:999px;margin-top:5px}
.ckrow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;position:relative;cursor:pointer;font-size:14.5px;line-height:1.4}
.ckrow+.ckrow{border-top:.5px solid var(--hair)}
.ckbox{flex:none;width:21px;height:21px;border-radius:7px;border:1.5px solid var(--ink3);margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:background .12s,border-color .12s}
.ckrow.on .ckbox{background:var(--teal);border-color:var(--teal)}
.ckrow.on{color:var(--ink3)}
.score{font-size:15px;font-weight:650;padding:10px 16px;background:var(--surface);border-radius:var(--r);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11.5px;padding:2.5px 9px;border-radius:999px;font-weight:500;letter-spacing:.01em}
</style>
</head>
<body>
<div class="topbar" id="topbar"><div class="tb-in">
  <span class="tb-btn" id="backbtn" data-action="back" style="visibility:hidden">&#8249; Back</span>
  <div class="tb-title" id="tbtitle">Directory</div>
  <div class="seg" id="seg">
    <span id="segB" class="on" data-action="tab-browse">Browse</span>
    <span id="segP" data-action="tab-path">Pathway</span>
    <span id="segT" data-action="tab-tools">Tools</span>
  </div>
</div></div>
<div class="page" id="app"></div>
<div class="dock"><div class="dock-in">
  <span class="ic">&#x2315;</span>
  <input id="q" type="search" placeholder="Search 241 services...">
  <span class="hb" data-action="home">H</span>
</div></div>
<input type="file" id="fileinput" accept=".xlsx,.xlsm">
<div class="toast" id="toast"></div>

        for(var i=0;i<LAWBYNAME.length;i++){

  });

/* Reads the _Config tab if the workbook has one. Columns:
   A sheet name | B display name | C colour | D order | E show in Guide me
   Falls back to the categories already in the app when _Config is absent. */
function readConfig(wb){
  var ws = wb.Sheets["_Config"];
  if(!ws) return null;
  var rows = XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  var out = [];
  for(var r=1; r<rows.length; r++){
    var v = (rows[r]||[]).map(function(x){return String(x===undefined?"":x).trim();});
    if(!v[0] || v[0].toLowerCase().indexOf("sheet name")===0) continue;
    if(!wb.Sheets[v[0]]) continue;
    out.push({id:v[0], name:v[1]||v[0], color:(v[2]||"#0E5E52"), order:parseInt(v[3],10)||999});
  }
  out.sort(function(a,b){return a.order-b.order;});
  return out.length?out:null;
}

function importWorkbook(buf, fname){
  var wb = XLSX.read(buf,{type:"array"});
  var newData=[], missing=[], count=0;
  var cfg = readConfig(wb);
  var plan = cfg || Object.keys(SHEETMAP).map(function(sid){
    return {id:sid, name:SHEETMAP[sid], color:COLORS[sid]||"#0E5E52"};
  });
  plan.forEach(function(entry){
    var sid = entry.id;
    var ws = wb.Sheets[sid];
    if(!ws){ missing.push(sid); return; }
    var rows = XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
    var cat = {id:sid, name:entry.name, groups:[], color:entry.color, key:sid.replace(/ /g,"_").replace(/&/g,"")};
    var cur = {name:null, services:[]};
    for(var r=3; r<rows.length; r++){
      var row = rows[r]||[];
      var raw0 = String(row[0]===undefined?"":row[0]);
      var v = [];
      for(var i=0;i<10;i++) v.push(String(row[i]===undefined?"":row[i]).trim());
      var any=false; for(var i=0;i<10;i++){ if(v[i]){any=true;break;} }
      if(!any) continue;
      if(raw0 !== raw0.replace(/^\s+/,"") && !v[1] && !v[2] && !v[4]){
        if(cur.services.length) cat.groups.push(cur);
        cur = {name:v[0], services:[]};
        continue;
      }
      if(!v[0]) continue;
      cur.services.push({
        name:v[0],
        phone:v[1].replace(/\n/g," / "),
        website:v[2],
        hours:v[3].replace(/\n/g,"; "),
        desc:v[4],
        region:v[5],
        verified: v[7].charAt(0)==="Y",
        tags: v[9]?v[9].split(",").map(function(x){return x.trim();}).filter(function(x){return x;}):undefined,
        law: (String(row[10]===undefined?"":row[10]).trim())||undefined
      });
      count++;
    }
    if(cur.services.length) cat.groups.push(cur);
    cat.count = cat.groups.reduce(function(a,g){return a+g.services.length;},0);
    newData.push(cat);
  });
  if(!newData.length){ toast("No recognisable sheets found"); return; }
  var meta = {file:fname, date:new Date().toLocaleDateString("en-AU"), count:count, config:!!cfg};
  try{
    localStorage.setItem(LSKEY, JSON.stringify({data:newData, meta:meta}));
  }catch(e){ toast("Saved for this session only (storage full)"); }
  DATA = newData; dataMeta = meta; reindex();
  ge("q").setAttribute("placeholder","Search "+totalCount()+" services...");
  var msg = "Updated: "+count+" services across "+newData.length+" categories";
  if(!cfg) msg += " - no _Config tab, used built-in category list";
  if(missing.length) msg += " ("+missing.length+" sheet"+(missing.length>1?"s":"")+" not found: "+missing.join(", ")+")";
  toast(msg);
  state={tab:"browse",cat:null,path:[],q:""};
  ge("q").value="";
  render();
}

function resetData(){
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  DATA = BUILTIN; dataMeta = null; reindex();
  ge("q").setAttribute("placeholder","Search "+totalCount()+" services...");
  toast("Restored built-in data");
  state={tab:"browse",cat:null,path:[],q:""};
  render();
}

function svcRow(s,color){
  var tel=telHref(s.phone), web=webHref(s.website);
  var h='<div class="srow">';
  h+='<div class="line1"><div class="nm">'+esc(s.name)+'</div>';
  if(s.verified) h+='<span class="vd" title="Verified"></span>';
  h+='</div>';
  if(s.desc) h+='<div class="ds">'+esc(s.desc)+'</div>';
  var meta=[];
  if(s.hours&&s.hours!=="-") meta.push(esc(s.hours));
  if(s.region) meta.push(esc(s.region));
  if(meta.length) h+='<div class="meta">'+meta.join(" &middot; ")+'</div>';
  if(s.law) h+='<div class="law">&sect; <b>'+esc(s.law)+'</b></div>';
  if(s.tags&&s.tags.length){
    h+='<div class="tagrow">';
    s.tags.forEach(function(x){h+='<span class="tag" style="color:'+color+';background:'+tint(color,.09)+'">'+esc(x)+'</span>';});
    h+='</div>';
  }
  var hasAct=tel||web||(s.phone&&s.phone!=="-");
  if(hasAct){
    h+='<div class="acts">';
    if(tel){
      h+='<a class="call" href="'+tel+'" style="color:'+color+';background:'+tint(color,.11)+'">&#9742; '+esc(s.phone.split("/")[0].trim())+'</a>';
    }else if(s.phone&&s.phone!=="-"){
      h+='<span class="call" style="color:'+color+';background:'+tint(color,.11)+'">'+esc(s.phone)+'</span>';
    }
    if(web){
      h+='<a class="web2" href="'+web+'" target="_blank" rel="noreferrer">'+esc(s.website.replace(/^https?:\/\//,"").split("/")[0])+'</a>';
    }
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function terminalHTML(term){
  var cat=byId[term.cat];
  if(!cat){ return '<div class="empty">This pathway needs a category that is not in the current data. Check the spreadsheet sheet names.</div>'; }
  var groups=cat.groups;
  if(term.groups) groups=groups.filter(function(g){return term.groups.indexOf(g.name)!==-1;});
  var h='<div class="qtitle" style="color:'+cat.color+'">'+esc(cat.name)+'</div>';
  h+='<div class="subline">Pathway result</div>';
  if(term.note) h+='<div class="note2" style="border-left-color:'+cat.color+'">'+esc(term.note)+'</div>';
  var shown=0;
  groups.forEach(function(g){
    var svcs=g.services;
    if(term.only) svcs=svcs.filter(function(s){return term.only.indexOf(s.name)!==-1;});
    if(!svcs.length)return;
    shown+=svcs.length;
    if(g.name) h+='<div class="group-h">'+esc(g.name)+'</div>';
    h+='<div class="group">';
    svcs.forEach(function(s){h+=svcRow(s,cat.color);});
    h+='</div>';
  });
  if(!shown && !term.only){
    h+='<div class="group">';
    cat.groups.forEach(function(g){ g.services.forEach(function(s){ h+=svcRow(s,cat.color); }); });
    h+='</div>';
  }
  if(term.extra){
    var ec=byId[term.extra.cat];
    if(ec){
      var svcs=[];
      ec.groups.forEach(function(g){g.services.forEach(function(s){
        for(var i=0;i<term.extra.match.length;i++){
          if(s.name.indexOf(term.extra.match[i])!==-1){svcs.push(s);break;}
        }
      });});
      if(svcs.length){
        h+='<div class="group-h">Also relevant &mdash; '+esc(ec.name)+'</div><div class="group">';
        svcs.forEach(function(s){h+=svcRow(s,ec.color);});
        h+='</div>';
      }
    }
  }
  h+='<div class="pill-link" data-action="from-result" data-key="'+cat.key+'">';
  h+='Browse the full '+esc(cat.name)+' category &#8250;</div>';
  return h;
}

    opts:[["y","Yes",1],["n","No",0],["x","Not asked",0]],
    pos:function(){
      return '<div class="group-h" style="color:#7E2D46">Concern raised</div><div class="acard" style="border-left:3px solid #7E2D46"><div class="ab">A yes on Q2&ndash;6 raises suspicion &mdash; EASI does not diagnose abuse. Do not confront the suspected person or promise secrecy.<p><b>Elder Abuse Helpline (EAPU) <a href="tel:1300651192" style="font-weight:600">1300&nbsp;651&nbsp;192</a></b> &mdash; advice for you or the patient. <b>SLASS</b> pairs a lawyer with a social worker, which many reluctant clients will accept when pure legal action feels too big. Suspected abuse of an adult with impaired capacity &rarr; Office of the Public Guardian can investigate.</p><p>Discuss with Al before acting; document what was said, verbatim where possible, with attribution.</p><span class="pill-link" data-action="from-result" data-key="DV__Abuse">Elder abuse services in the directory &#8250;</span></div></div>';
    },
    neg:'<div class="group-h">No concerns flagged</div><div class="acard"><div class="ab">A negative screen is a point-in-time result. Q1 (dependence) without abuse still maps to support needs &mdash; consider the aged care pathway. Re-screen if presentation, finances or family dynamics change.</div></div>'
  },
  csi:{
    color:"#B05A7E", title:"Carer strain &mdash; Modified CSI",
    sub:"Modified Caregiver Strain Index. 13 items scored 2 (yes, on a regular basis), 1 (yes, sometimes), 0 (no). Asked of the <b>carer</b>, not the patient.",
    note:"There is no hard cutoff &mdash; higher scores mean more strain, and any positive item is a conversation opener. Score the conversation, not just the number.",
    mode:"sum", max:26,
    qs:[
      "My sleep is disturbed","Caregiving is inconvenient","Caregiving is a physical strain","Caregiving is confining",
      "There have been family adjustments","There have been changes in personal plans","There have been other demands on my time",
      "There have been emotional adjustments","Some behaviour is upsetting","It is upsetting to find the person I care for has changed so much",
      "There have been work adjustments","Caregiving is a financial strain","I feel completely overwhelmed"
    ],
    opts:[["2","Regularly",2],["1","Sometimes",1],["0","No",0]],
    result:function(score,answered,total){
      if(answered<total) return '<div class="foot">'+answered+' of '+total+' answered</div>';
      var h='<div class="score"><span>Score</span><span>'+score+' / 26</span></div>';
      h+='<div class="acard"><div class="ab">Higher scores indicate greater strain. Walk back through the positive items with the carer &mdash; each one points to a specific support.<p><b>Carer Gateway <a href="tel:1800422737" style="font-weight:600">1800&nbsp;422&nbsp;737</a></b> &mdash; counselling, coaching, emergency respite. Planned respite runs through My Aged Care. Sustained high strain is a risk factor for the care arrangement breaking down &mdash; and for elder abuse &mdash; so flag it early.</p><span class="pill-link" data-action="from-result" data-key="Carers">Carer &amp; respite services in the directory &#8250;</span></div></div>';
      return h;
    }
  },
  ucla:{
    color:"#2E7D5B", title:"Loneliness &mdash; UCLA-3",
    sub:"Three-item UCLA Loneliness Scale. Each item scored 1 (hardly ever), 2 (some of the time), 3 (often). Total 3&ndash;9; <b>6 or more</b> is commonly classed as lonely.",
    note:"Ask as a conversation, not a quiz &mdash; &ldquo;how often do you feel&hellip;&rdquo; lands better spoken than read.",
    mode:"sum", max:9, cutoff:6,
    qs:[
      "How often do you feel that you lack companionship?",
      "How often do you feel left out?",
      "How often do you feel isolated from others?"
    ],
    opts:[["1","Hardly ever",1],["2","Sometimes",2],["3","Often",3]],
    result:function(score,answered,total){
      if(answered<total) return '<div class="foot">'+answered+' of '+total+' answered</div>';
      var h='<div class="score"><span>Score</span><span>'+score+' / 9'+(score>=6?' &mdash; lonely range':'')+'</span></div>';
      h+='<div class="acard"><div class="ab">'+(score>=6?'Scores of 6+ sit in the lonely range. ':'')+'Loneliness is a referral target in its own right &mdash; social support groups, community visitors through the <b>Aged Care Volunteer Visitors Scheme</b>, day respite with a social component, and transport to get there.<p>Persistent loneliness alongside low mood is worth raising with the team &mdash; James (psychology) three days a week.</p><span class="pill-link" data-action="from-result" data-key="Community">Community &amp; social support in the directory &#8250;</span></div></div>';
      return h;
    }
  }
};
function screenerHTML(id){
  var S=SCREENERS[id], A=scrAns[id]||{};
  var h='<div class="fade"><span class="draft">Draft &mdash; pending team review</span>';
  h+='<div class="qtitle" style="color:'+S.color+'">'+S.title+'</div>';
  h+='<div class="qsub">'+S.sub+'</div>';
  if(S.note) h+='<div class="note2" style="border-left-color:'+S.color+'">'+S.note+'</div>';
  h+='<div class="group-h">Questions</div><div class="qlist">';
  var answered=0, score=0, flag=false;
  S.qs.forEach(function(q,i){
    var a=A[i];
    if(a!==undefined){
      answered++;
      for(var oi=0;oi<S.opts.length;oi++){
        if(S.opts[oi][0]===a){
          score+=S.opts[oi][2];
          if(S.mode==="flag"&&S.opts[oi][2]>0&&i>=S.flagFrom)flag=true;
        }
      }
    }
    h+='<div class="qi"><span class="qn">'+(i+1)+'</span>'+q+'<div class="acts" style="margin-top:8px">';
    S.opts.forEach(function(o){
      var on=a===o[0];
      h+='<span class="call" data-action="scr-ans" data-tool="'+id+'" data-i="'+i+'" data-v="'+o[0]+'" style="'+
        (on?'color:#fff;background:'+S.color:'color:'+S.color+';background:'+tint(S.color,.1))+'">'+o[1]+'</span>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  if(S.mode==="flag"){
    if(flag) h+=S.pos();
    else if(answered===S.qs.length) h+=S.neg;
    else h+='<div class="foot">'+answered+' of '+S.qs.length+' answered</div>';
  }else{
    h+=S.result(score,answered,S.qs.length);
  }
  h+='<div class="pill-link" data-action="scr-clear" data-tool="'+id+'" style="color:#B3372B">Clear answers</div>';
  h+='<div class="foot">Answers exist only on this screen &mdash; nothing is saved or sent. Clear before handing the device on.</div>';
  h+='</div>';
  return h;
}

var GREEN="#3D6B35";

  var h='<div class="qtitle" style="color:'+GREEN+'">My Aged Care &amp; Support at Home</div>';
  h+='<div class="qsub">The gateway to subsidised aged care. Governed by the <b>Aged Care Act 2024 (Cth)</b>, in force since 1 November 2025, including the Statement of Rights.</div>';

  h+=acard('1 &middot; Register',['1800 200 422'],
    'Eligibility: <b>65+</b>, or <b>50+ for Aboriginal and Torres Strait Islander people</b>. Under 65 &rarr; NDIS pathway, not aged care.<p>Register by phone, at myagedcare.gov.au, or via GP/hospital referral. Family or the hospital team can refer with the patient&rsquo;s consent.</p>');

  h+=acard('2 &middot; Assessment',['Single Assessment System'],
    'One assessment workforce now covers everything from entry-level to high needs (the old RAS/ACAT split ended in Dec 2024). The assessment determines which programs and funding level the patient can access. Hospital patients can be assessed before discharge &mdash; flag it early.');

  h+=acard('3 &middot; Services &amp; funding',['Support at Home','CHSP'],
    '<b>Support at Home</b> replaced Home Care Packages and STRC from 1 Nov 2025: 8 funding classifications, quarterly budgets, and means-tested contributions &mdash; <b>clinical care is fully government-funded</b>; contributions apply to independence and everyday-living supports. Existing HCP recipients were transitioned under a no-worse-off principle.<p><b>CHSP</b> continues as the separate entry-level program (until at least mid-2027) &mdash; often the fastest way to get something started.</p><span class="pill-link" data-action="from-result" data-key="Aged_Care">Browse Aged Care providers &#8250;</span>',
    '<b>Wait times are the pressure point.</b> Assessment to service commencement can take months. Be honest with patients about the queue, arrange interim CHSP or carer respite, and document unmet need.');

  return h;
}

var PINS=[
  {a:"open-acp",c:"#3E5C8C",t:"Advance Care Planning",s:"Forms, legislation &amp; pathways",
   k:["acp","advance care","epoa","enduring power","power of attorney","advance health directive","ahd","statement of choices","guardianship","guardian","capacity","substitute decision"]},
  {a:"open-mac",c:"#3D6B35",t:"My Aged Care &amp; Support at Home",s:"Registration, assessment, funding &amp; wait times",
   k:["my aged care","support at home","chsp","hcp","home care package","single assessment","aged care funding","mac registration"]}
];
function pinHTML(t){
  var h="";
  PINS.forEach(function(p){
    for(var i=0;i<p.k.length;i++){
      if(t.indexOf(p.k[i])!==-1||(p.k[i].indexOf(t)===0&&t.length>=3)){
        h+='<div class="group" style="margin-bottom:14px"><div class="row" data-action="'+p.a+'">';
        h+='<span class="dot" style="background:'+p.c+'"></span>';
        h+='<span class="lbl"><b style="font-weight:600">'+p.t+'</b><br><span style="font-size:12.5px;color:var(--ink3)">'+p.s+'</span></span>';
        h+='<span class="chev">&#8250;</span></div></div>';
        break;
      }
    }
  });
  return h;
}
var ALIASES=[
  ["domestic assistance","cleaning","housework","laundry","vacuuming","home help"],
  ["personal care","showering","bathing","hygiene","dressing","grooming"],
  ["nursing","nurse","wound care","medication support"],
  ["allied health","physio","physiotherapy","podiatry","occupational therapy","dietitian"],
  ["transport","community transport","lifts to appointments"],
  ["meals","meal delivery","food delivery","meals on wheels"],
  ["respite","carer break","short-term stay"],
  ["social support","companionship","loneliness","social visits"],
  ["residential care","nursing home","racf","aged care home","residential aged care"],
  ["memory support","dementia","alzheimer","memory care"],
  ["elder abuse","financial abuse","eapu","slass","mistreatment","exploitation"],
  ["carer","caregiver","respite","carer support","carer gateway"],
  ["loneliness","social isolation","lonely","companionship","social connection"],
  ["financial hardship","emergency relief","food relief","no interest loans","nils","debt"],
  ["interpreter","translating","tis","language support"],
  ["gardening","lawn","mowing","yard maintenance","garden maintenance","yard"],
  ["shopping","grocery","errands"],
  ["pet care","pets","dog walking","pet boarding","companion animal","emergency boarding"],
  ["volunteer visiting","acvvs","friendly visiting","visitor scheme","befriending","cuppa","companionship"]
];

/* Words where "everything in the same family" is the wrong answer.
   A query in this list splits the results: services that actually name it,
   then the wider family underneath, clearly labelled. */
var NARROW = {
  "cleaning":       "Domestic assistance providers - cleaning not separately confirmed",
  "housework":      "Domestic assistance providers - housework not separately confirmed",
  "laundry":        "Domestic assistance providers - laundry not separately confirmed",
  "gardening":      "Providers with broader home maintenance - gardening not separately confirmed",
  "lawn":           "Providers with broader home maintenance - lawn care not separately confirmed",
  "mowing":         "Providers with broader home maintenance - mowing not separately confirmed",
  "shopping":       "Providers with broader domestic support - shopping not separately confirmed",
  "dog walking":    "Pet and home support services - dog walking not separately confirmed",
  "showering":      "Personal care providers - showering not separately confirmed",
  "physio":         "Allied health providers - physiotherapy not separately confirmed"
};
function expandQuery(t){
  var terms=[t];
  ALIASES.forEach(function(gr){
    for(var i=0;i<gr.length;i++){
      if(t.indexOf(gr[i])!==-1||(t.length>=5&&gr[i].indexOf(t)===0)){
        gr.forEach(function(x){if(terms.indexOf(x)===-1)terms.push(x);});
        break;
      }
    }
  });
  return terms;
}
function searchHTML(q){
  var t=q.toLowerCase(),terms=expandQuery(t),out=[];
  DATA.forEach(function(c){c.groups.forEach(function(g){g.services.forEach(function(s){
    var hay=(s.name+" "+s.desc+" "+s.region+" "+(g.name||"")+" "+((s.tags||[]).join(" "))+" "+(s.law||"")).toLowerCase();
    var direct=hay.indexOf(t)!==-1, hit=direct;
    if(!hit){for(var i=1;i<terms.length;i++){if(hay.indexOf(terms[i])!==-1){hit=true;break;}}}
    if(hit) out.push({s:s,c:c,d:direct?0:1});
  });});});
  if(!out.length){
    return '<div class="fade">'+pinHTML(t)+'<div class="empty">No matches for &ldquo;'+esc(q)+'&rdquo;.<br>Try a broader word &mdash; meals, legal, dementia.</div></div>';
  }
  out.sort(function(a,b){return a.d-b.d;});

  function block(list){
    var byCat={},order=[],h="";
    list.forEach(function(r){
      if(!byCat[r.c.key]){byCat[r.c.key]={c:r.c,items:[]};order.push(r.c.key);}
      byCat[r.c.key].items.push(r.s);
    });
    order.forEach(function(k){
      var b=byCat[k];
      h+='<div class="reslabel2" style="color:'+b.c.color+'">'+esc(b.c.name)+'</div>';
      h+='<div class="group">';
      b.items.forEach(function(x){h+=svcRow(x,b.c.color);});
      h+='</div>';
    });
    return h;
  }

  var narrowLabel=null;
  Object.keys(NARROW).forEach(function(w){ if(t.indexOf(w)!==-1) narrowLabel=NARROW[w]; });
  var exact = out.filter(function(r){return r.d===0;});
  var wider = out.filter(function(r){return r.d!==0;});
  var split = narrowLabel && exact.length && wider.length;

  var h='<div class="fade"><div class="large" style="font-size:24px">'+out.length+' result'+(out.length!==1?'s':'')+'</div>';
  h+='<div class="subline">for &ldquo;'+esc(q)+'&rdquo;'+(terms.length>1?' &middot; including related services':'')+'</div>';
  h+=pinHTML(t);
  if(split){
    h+='<div class="note2"><b>'+exact.length+'</b> service'+(exact.length!==1?'s':'')+' name '+
       '&ldquo;'+esc(q)+'&rdquo; directly. The rest are listed underneath &mdash; ring to confirm before referring.</div>';
    h+=block(exact);
    h+='<div class="reslabel2" style="color:var(--ink3);padding-top:10px">'+esc(narrowLabel)+' ('+wider.length+')</div>';
    h+=block(wider);
  }else{
    h+=block(out);
  }
  h+='</div>';
  return h;
}
